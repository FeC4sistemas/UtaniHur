# Utanihur — nginx: serve o web estático e faz reverse-proxy de /api → Express.
# Como o web usa fetch('/api/...') relativo, servir os dois no MESMO domínio
# dispensa CORS e variável de URL da API.
#
# Instalar: copie para /etc/nginx/sites-available/utanihur, ajuste server_name
# e o certificado (rode `certbot --nginx` depois), então:
#   ln -s /etc/nginx/sites-available/utanihur /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name utanihur.com www.utanihur.com;   # << troque pelo seu domínio

    # Build do web (npm run build:web → apps/web/dist)
    root /srv/utanihur/apps/web/dist;
    index index.html;

    # gzip (a API já usa compression; aqui cobre os estáticos)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome → cache longo e imutável
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API → Express (systemd) na :3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
